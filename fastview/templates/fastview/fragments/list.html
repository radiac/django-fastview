{% load fastview i18n %}
<div class="fastview-list">
  {% if filters %}
    {% fragment_component "filter.html" %}
  {% endif %}

  <div class="fastview-list-data">
    {% fragment_component "actions.html" %}
    {% fragment_component "data.html" %}

    {% block pagination %}
      {% if page_obj %}
        {% fragment_component "pagination.html" %}
      {% endif %}
    {% endblock %}

  </div>

</div>
